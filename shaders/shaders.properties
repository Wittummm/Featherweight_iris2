screen.columns = 3
screen = \
    [GENERAL] [LIGHTING] [ATMOSPHERE_todo] \
    [POST_PROCESS_todo] <empty> <empty> \
    [DEBUG]
    
screen.GENERAL.columns = 3
screen.GENERAL = sunPathRotation

screen.LIGHTING.columns = 3
screen.LIGHTING = [SHADING] [SHADOWS]

screen.SHADING.columns = 3
screen.SHADING = \
    PBR SpecularEnabled [PIXELIZATION] \
    NormalMapStrength <empty> <empty>
screen.PIXELIZATION.columns = 3
screen.PIXELIZATION = Pixelization ShadingPixelization ShadowPixelization
screen.SHADOWS.columns = 3
screen.SHADOWS = \
    ShadowsEnabled [SOFT_SHADOWS] [SHADOW_FADING] \
    shadowMapResolution shadowDistance ShadowCascadeCount \
ShadowFilter SHADOW_COLOR ShadowThreshold  \
ShadowDistort SHADOW_BIAS [SHADOW_BIAS] \
ShadowFadeShape SHADOW_FADE_START ShadowFadeStrength
screen.SHADOW_BIAS.columns = 3
screen.SHADOW_BIAS = SHADOW_BIAS ShadowDistortBias ShadowBiasDistortFacMin ShadowBiasZSkew
screen.SOFT_SHADOWS.columns = 3
screen.SOFT_SHADOWS = \
    ShadowFilter ShadowSoftness <empty> \
    ShadowSamplesQuality ShadowSamples <empty> \
    ShadowSoftnessFadeStrength SHADOW_SOFTNESS_FADE_START
screen.SHADOW_FADING.columns = 3
screen.SHADOW_FADING = ShadowFadeShape SHADOW_FADE_START ShadowFadeStrength ShadowSoftnessFadeStrength SHADOW_SOFTNESS_FADE_START 

screen.DEBUG.columns = 3
screen.DEBUG = \
        DebugEnabled _DebugStats _DebugUIScale \
[_BUFFERS]  [_SHADOWS] _DebugPassIndex
screen._BUFFERS = _ScreenEnabled _ScreenMode _ShowLightLevel _ShowShadowMap _ShowShadowColor _ShowDepth _ShowRoughness _ShowReflectance _ShowPorosity _ShowEmission _ShowNormals _ShowAmbientOcclusion _ShowHeight
screen._SHADOWS = _ShowShadows _ShowShadowCascades _DebugShadowCascadeIndex 

sliders = _ShowShadowColor SHADOW_COLOR ShadowSamplesQuality ShadowSamples ShadowSoftness sunPathRotation ShadowBiasZSkew ShadowDistortBias ShadowBiasDistortFacMin _DebugPassIndex Pixelization NormalMapStrength ShadowSoftnessFadeStrength SHADOW_SOFTNESS_FADE_START SHADOW_FADE_START ShadowFadeStrength ShadowDistort SHADOW_BIAS ShadowFilter ShadowThreshold shadowMapResolution shadowDistance ShadowCascadeCount ShadingPixelization ShadowPixelization PBR _DebugUIScale _ScreenMode _ShowLightLevel _ShowShadowMap _ShowDepth _ShowRoughness _ShowReflectance _ShowPorosity _ShowEmission _ShowNormals _ShowAmbientOcclusion _ShowHeight 

program.composite80.enabled=DEBUG
shadow.enabled=ShadowsEnabled

#############
separateAo=true

iris.features.required = SEPARATE_HARDWARE_SAMPLERS COMPUTE_SHADERS

# Custom Resources
customTexture.lightMapTex = minecraft:dynamic/lightmap_1

# Uniforms

# Math in shaders.properties is limited, the types must match exact(ie vec3 * float is invalid), constructors must be filled with no missing params, etc

uniform.vec2.screenSize = vec2(viewWidth, viewHeight)
uniform.vec2.oneOverScreenSize = vec2(1.0/viewWidth, 1.0/viewHeight)

variable.vec3.oneOverPosLength = vec3(0.01, 0.01, 0.01)
uniform.vec3.lightPosition = shadowLightPosition
uniform.vec3.moonDirection = moonPosition * oneOverPosLength
uniform.vec3.sunDirection = sunPosition * oneOverPosLength
uniform.vec3.lightDirection = shadowLightPosition * oneOverPosLength
uniform.vec3.upDirection = upPosition * oneOverPosLength
